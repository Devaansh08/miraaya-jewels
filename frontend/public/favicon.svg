<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e0b7"/>
      <stop offset="45%" stop-color="#dba755"/>
      <stop offset="100%" stop-color="#9a6e26"/>
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#241e18"/>
      <stop offset="100%" stop-color="#11100f"/>
    </radialGradient>
  </defs>

  <!-- Luxury Background Disc -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="43" fill="none" stroke="rgba(219, 167, 85, 0.3)" stroke-width="0.8" stroke-dasharray="2, 2"/>

  <!-- Top Diamond Jewel Sparkle -->
  <polygon points="50,14 53,20 50,26 47,20" fill="url(#goldGrad)"/>
  <polygon points="44,20 50,17 56,20 50,23" fill="#ffffff" opacity="0.8"/>

  <!-- Royal Serif Monogram "M" -->
  <text x="50" y="72"
        font-family="'Cormorant Garamond', Georgia, serif"
        font-size="44"
        font-weight="600"
        text-anchor="middle"
        fill="url(#goldGrad)"
        letter-spacing="-0.02em">M</text>

  <!-- Subtle Sub-arch jewel dots -->
  <circle cx="34" cy="79" r="1.5" fill="url(#goldGrad)"/>
  <circle cx="50" cy="82" r="1.8" fill="url(#goldGrad)"/>
  <circle cx="66" cy="79" r="1.5" fill="url(#goldGrad)"/>
</svg>
